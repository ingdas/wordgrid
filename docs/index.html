<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5ea" />
    <!-- CrazyGames SDK. Loads defensively: src/sdk.ts no-ops every call when the
         SDK is absent OR present-but-disabled for the domain (local play, GitHub
         Pages, where every call fails with `sdkDisabled`), and rewarded flows
         grant the reward anyway — so this is safe everywhere. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async></script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9482b'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23faf5ea'%3E%E2%97%86%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Four hidden groups. One secret word links them all. Can you find it? A free daily word puzzle."
    />
    <!-- Level tracking (src/stats.ts). Empty = off: no requests, no data
         collected, and the game plays exactly the same. Point it at a stats
         server — see server/stats-server.mjs — to start counting who clears
         which level. Build-time `VITE_STATS_URL` wins over this tag; the tag
         exists so the committed docs/ build can be switched on without one.
         Anonymous either way: a random per-install id, the level, the outcome. -->
    <meta name="wordgrid:stats" content="" />
    <!-- Product analytics (src/analytics.ts): a self-hosted Umami. Both empty =
         off: no script is loaded, nothing is collected. Fill them with the
         tracker script's full URL (whatever TRACKER_SCRIPT_NAME made it) and
         the website id from the Umami dashboard; build-time VITE_UMAMI_SCRIPT /
         VITE_UMAMI_WEBSITE win over these tags. Cookieless and anonymous: the
         per-install id, the screens, the events — never a word the player typed. -->
    <meta name="wordgrid:umami-script" content="https://umami.ingel.ing/script.js" />
    <meta name="wordgrid:umami-website" content="c8f6b6b5-4a6f-4188-b27b-59c6845de639" />
    <!-- The community clear rate on the level index reads back out of Umami
         (src/umamiLevels.ts). It needs a *share* slug: in Umami, the website's
         Settings → Share URL → enable, then paste the slug out of the URL
         (…/share/<slug>/<name>). Anything the share exposes becomes publicly
         readable, so scope it to Events if you scope it at all. Empty = the
         index simply shows no clear-rate line; no request is made. -->
    <meta name="wordgrid:umami-share" content="Xg2fTOIGWkVIOrJ7" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WordGrid" />

    <!-- Open Graph / Twitter: rich previews when the link is shared. og:image
         should be an absolute URL; update the host if you deploy elsewhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordGrid" />
    <meta property="og:title" content="WordGrid — Find the secret word" />
    <meta
      property="og:description"
      content="Four hidden groups. One secret word links them all. Can you find it?"
    />
    <meta property="og:image" content="https://ingdas.github.io/wordgrid/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordGrid — Find the secret word" />
    <meta
      name="twitter:description"
      content="Four hidden groups. One secret word links them all. Can you find it?"
    />
    <meta name="twitter:image" content="https://ingdas.github.io/wordgrid/og-image.png" />

    <title>WordGrid — Find the Four</title>
    <script type="module" crossorigin src="./assets/index-iKhA00Re.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DvgAeLcW.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only on short landscape viewports (phones turned sideways). A
         portrait word puzzle plays best upright — but this is a recommendation,
         not a wall: some players can't rotate (locked orientation, a mount, a
         short desktop window), so it can be dismissed for the session. -->
    <div class="rotate-hint" role="alert">
      <div class="rotate-hint__icon" aria-hidden="true">📲</div>
      <div class="rotate-hint__title">Rotate to portrait</div>
      <p class="rotate-hint__body">WordGrid plays best with your phone upright.</p>
      <button type="button" class="rotate-hint__dismiss" onclick="document.documentElement.setAttribute('data-rotate','dismissed')">
        Play anyway
      </button>
    </div>
  </body>
</html>
